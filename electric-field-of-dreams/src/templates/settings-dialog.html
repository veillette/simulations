<div class="settings-btn-wrapper">
    <button class="settings-btn" title="Electric Field Settings" data-bs-toggle="modal" data-bs-target="#settings-dialog"><span class="fa fa-cogs"></span></button>
</div>

<div class="modal" id="settings-dialog">
    <div class="modal-dialog">
        <div class="modal-content">

                <h4 class="modal-title">Electric Field Settings</h4>
            </div>
            <div class="modal-body">
                
                <div class="row">
                    <div class="col-4">
                        <label>Field Discreteness</label>
                    </div>
                    <div class="col-8">
                        <div class="slider" id="efield-discreteness-slider"></div>
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>

        </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
</div><!-- /.modal -->
