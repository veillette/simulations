# Dependabot version updates for the root tooling and every sim package.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/*"
      - "/common/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      # Batch transitive/dev tooling bumps so we don't get dozens of tiny PRs per sim
      production-deps:
        dependency-type: "production"
      development-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
