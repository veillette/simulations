<div class="settings-btn-wrapper">
    <button class="settings-btn" title="Teacher Settings" data-bs-toggle="modal" data-bs-target="#settings-dialog"><span class="fa fa-cogs"></span></button>
</div>

<div class="modal" id="settings-dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <h4 class="modal-title">Teacher Settings</h4>
            </div>
            <div class="modal-body">
                
                <div class="row">
                    <div class="col-6">
                        <label>Measure temperature in</label>
                    </div>
                    <div class="col-6 control-column">
                        <input type="radio" name="temperature-setting" id="temperature-kelvin" checked>
                        <label for="temperature-kelvin">Kelvin</label>

                        <input type="radio" name="temperature-setting" id="temperature-celsius">
                        <label for="temperature-celsius">Celsius</label>
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
</div><!-- /.modal -->
